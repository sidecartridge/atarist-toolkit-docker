name: Test

# Trigger when a pull request is received
on:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v2
    - name: Run - build
      run: make build ARCH=${{ matrix.arch }}
    - name: Run - test
      run: make test ARCH=${{ matrix.arch }}
